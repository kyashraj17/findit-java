<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gallery</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments :: nav}"></div><main class="container gallery-page"><div class="section-head"><div><div class="eyebrow dark">LOST & FOUND</div><h1>Item Gallery</h1><p>Browse all reported lost and found items.</p></div></div><form class="filter-bar" th:action="@{/gallery}" method="get"><input name="q" th:value="${q}" placeholder="Search by keyword..."><select name="status"><option value="">All Types</option><option value="LOST" th:selected="${status == 'LOST'}">Lost</option><option value="FOUND" th:selected="${status == 'FOUND'}">Found</option></select><select name="category"><option value="">All Categories</option><option th:each="c : ${categories}" th:value="${c}" th:text="${c}" th:selected="${category == c}"></option></select><input name="location" th:value="${location}" placeholder="Location"><button class="primary-btn">Search</button></form><div class="item-grid large"><a class="item-card" th:each="item : ${items}" th:href="@{/item/{id}(id=${item.id})}"><img th:if="${item.imagePath != null}" th:src="@{/uploads/{name}(name=${item.imagePath})}"><div th:unless="${item.imagePath != null}" class="placeholder-image">▧</div><div class="item-card-body"><div class="card-title-line"><h4 th:text="${item.itemName}"></h4><span class="pill" th:classappend="${#strings.toLowerCase(item.itemType.name())}" th:text="${item.itemType}"></span></div><small>⌖ <span th:text="${item.location}"></span></small><small>▤ <span th:text="${item.category}"></span></small></div></a><div th:if="${#lists.isEmpty(items)}" class="empty-state">No items matched your search.</div></div></main><div th:replace="~{fragments :: footer}"></div></body></html>
