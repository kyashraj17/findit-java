<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments :: nav}"></div><div th:replace="~{fragments :: alerts}"></div><main class="auth-page"><div class="auth-card"><div class="auth-logo">⌕</div><h1>Create Account</h1><p>Join FindIt to report or search for lost items.</p><form th:action="@{/register}" method="post" th:object="${formUser}"><label>Full Name</label><input th:field="*{name}" required><label>Email Address</label><input type="email" th:field="*{email}" required><label>College ID</label><input th:field="*{collegeId}"><label>Phone Number</label><input th:field="*{phone}"><label>Password</label><input type="password" name="password" required minlength="8"><label>Confirm Password</label><input type="password" name="confirmPassword" required minlength="8"><button class="primary-btn w-100">Register</button></form><div class="auth-bottom">Already have an account? <a th:href="@{/login}">Login</a></div></div></main><div th:replace="~{fragments :: footer}"></div></body></html>
