<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Possible Matches</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments :: nav}"></div><main class="container section-space"><div class="section-head"><div><div class="eyebrow dark">AI MATCHING</div><h1>Possible Matches</h1><p>Potential found items for <b th:text="${item.itemName}"></b>.</p></div></div><div class="match-card" th:each="match : ${matches}"><div class="match-image"><img th:if="${match.foundItem.imagePath != null}" th:src="@{/uploads/{name}(name=${match.foundItem.imagePath})}"><div th:unless="${match.foundItem.imagePath != null}" class="placeholder-image">▧</div></div><div class="match-copy"><h3 th:text="${match.foundItem.itemName}"></h3><p><span th:text="${match.foundItem.color}"></span> · <span th:text="${match.foundItem.category}"></span> · <span th:text="${match.foundItem.location}"></span></p><p th:text="${match.foundItem.description}"></p></div><div class="match-score"><strong th:text="${#numbers.formatDecimal(match.score,1,0) + '%'}"></strong><span>Possible match</span><a class="primary-btn small" th:href="@{/item/{id}(id=${match.foundItem.id})}">View Item</a></div></div><div th:if="${#lists.isEmpty(matches)}" class="empty-state">No potential matches yet.</div></main><div th:replace="~{fragments :: footer}"></div></body></html>
