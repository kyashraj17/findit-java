<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report Item</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments :: nav}"></div><div th:replace="~{fragments :: alerts}"></div><main class="form-page"><section class="form-panel"><div class="form-title"><span class="big-form-icon" th:classappend="${#strings.toLowerCase(type)}" th:text="${type == 'LOST' ? '!' : '✓'}"></span><div><div class="eyebrow dark">NEW REPORT</div><h1 th:text="'Report a ' + #strings.capitalize(#strings.toLowerCase(type)) + ' Item'"></h1><p>Provide details about the item.</p></div></div><form th:action="@{/report/{type}(type=${type})}" method="post" enctype="multipart/form-data"><div class="form-grid"><div><label>Item Name *</label><input name="itemName" required></div><div><label>Category *</label><select name="category" required><option value="">Select Category</option><option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option></select></div><div><label>Color</label><select name="color"><option value="">Select Color</option><option th:each="c : ${colors}" th:value="${c}" th:text="${c}"></option></select></div><div><label>Location *</label><input name="location" required></div><div><label>Date</label><input type="date" name="itemDate"></div><div class="full"><label>Description</label><textarea name="description" rows="4"></textarea></div><div class="full"><label>Upload Image</label><div class="upload-box"><i>⇧</i><input type="file" name="image" accept=".jpg,.jpeg,.png,.webp"><span>PNG, JPG or WEBP up to 5MB</span></div></div></div><button class="submit-report" th:classappend="${#strings.toLowerCase(type)}">Submit Report →</button></form></section></main><div th:replace="~{fragments :: footer}"></div><script th:src="@{/js/script.js}"></script></body></html>
