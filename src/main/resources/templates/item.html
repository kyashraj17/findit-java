<!doctype html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Item Details</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments :: nav}"></div><main class="container detail-page"><a class="back-link" th:href="@{/gallery}">← Back to Gallery</a><div class="detail-card"><div class="detail-image"><img th:if="${item.imagePath != null}" th:src="@{/uploads/{name}(name=${item.imagePath})}"><div th:unless="${item.imagePath != null}" class="placeholder-image">▧</div></div><div class="detail-copy"><div class="card-title-line"><h1 th:text="${item.itemName}"></h1><span class="pill" th:classappend="${#strings.toLowerCase(item.itemType.name())}" th:text="${item.itemType}"></span></div><div class="detail-list"><div><span>Category</span><b th:text="${item.category}"></b></div><div><span>Color</span><b th:text="${item.color ?: 'Not specified'}"></b></div><div><span>Location</span><b th:text="${item.location}"></b></div><div><span>Date</span><b th:text="${item.itemDate ?: 'Not specified'}"></b></div><div><span>Reported by</span><b th:text="${item.owner.name}"></b></div></div><h3>Description</h3><p th:text="${item.description ?: 'No description provided.'}"></p><a sec:authorize="isAuthenticated()" th:if="${item.itemType.name() == 'FOUND' and item.status.name() == 'ACTIVE'}" class="primary-btn" th:href="@{/claim/{id}(id=${item.id})}">Claim This Item</a><a sec:authorize="isAuthenticated()" th:if="${item.itemType.name() == 'LOST'}" class="outline-btn" th:href="@{/matches/{id}(id=${item.id})}">View Matches</a></div></div></main><div th:replace="~{fragments :: footer}"></div></body></html>
