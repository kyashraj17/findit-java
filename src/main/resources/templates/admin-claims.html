<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Claims Management</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments :: nav}"></div><div th:replace="~{fragments :: alerts}"></div><main class="container section-space"><div class="section-head"><div><div class="eyebrow dark">ADMIN</div><h1>Claims Management</h1></div></div><div class="panel table-responsive"><table class="modern-table"><thead><tr><th>Item</th><th>Claimant</th><th>Proof</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr th:each="c : ${claims}"><td th:text="${c.item.itemName}"></td><td th:text="${c.claimant.name}"></td><td th:text="${c.proof}"></td><td th:text="${c.status}"></td><td><span th:if="${c.status.name() != 'PENDING'}">—</span><span th:if="${c.status.name() == 'PENDING'}"><form class="inline-form" th:action="@{/admin/claims/{id}/approve(id=${c.id})}" method="post"><button class="mini green">Approve</button></form><form class="inline-form" th:action="@{/admin/claims/{id}/reject(id=${c.id})}" method="post"><button class="mini red">Reject</button></form></span></td></tr><tr th:if="${#lists.isEmpty(claims)}"><td colspan="5">No claims.</td></tr></tbody></table></div></main><div th:replace="~{fragments :: footer}"></div></body></html>
