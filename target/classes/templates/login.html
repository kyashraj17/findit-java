<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments :: nav}"></div><div th:replace="~{fragments :: alerts}"></div><main class="auth-page"><div class="auth-card"><div class="auth-logo">⌕</div><h1>Login</h1><p>Welcome back! Please login to continue.</p><form th:action="@{/login}" method="post"><label>Email Address</label><input type="email" name="username" required placeholder="you@college.edu"><label>Password</label><input type="password" name="password" required><button class="primary-btn w-100">Login</button></form><div class="auth-bottom">Don't have an account? <a th:href="@{/register}">Register</a></div></div></main><div th:replace="~{fragments :: footer}"></div></body></html>
