<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Claim Item</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments :: nav}"></div><div th:replace="~{fragments :: alerts}"></div><main class="form-page"><section class="form-panel narrow"><div class="form-title"><span class="big-form-icon found">✓</span><div><div class="eyebrow dark">VERIFICATION</div><h1>Claim <span th:text="${item.itemName}"></span></h1><p>Provide details to help verify ownership.</p></div></div><form th:action="@{/claim/{id}(id=${item.id})}" method="post"><label>Proof / Identifying Details *</label><textarea name="proof" rows="7" required placeholder="Unique sticker, contents, serial number or approximate time lost..."></textarea><button class="submit-report found">Submit Claim →</button></form></section></main><div th:replace="~{fragments :: footer}"></div></body></html>
