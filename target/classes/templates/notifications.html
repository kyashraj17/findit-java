<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments :: nav}"></div><main class="container section-space"><div class="section-head"><div><div class="eyebrow dark">UPDATES</div><h1>Notifications</h1></div></div><div class="panel"><div class="notification-row" th:each="n : ${allNotifications}"><span th:text="${n.message}"></span><small th:text="${#temporals.format(n.createdAt,'dd MMM yyyy HH:mm')}"></small></div><div th:if="${#lists.isEmpty(allNotifications)}" class="empty-state">No notifications.</div></div></main><div th:replace="~{fragments :: footer}"></div></body></html>
