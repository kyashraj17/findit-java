<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments :: nav}"></div><div th:replace="~{fragments :: alerts}"></div><div class="app-shell"><aside class="sidebar"><div class="side-brand">⌕ FindIt <small>ADMIN</small></div><a class="active" th:href="@{/admin}">▦ Dashboard</a><a th:href="@{/gallery}">▣ All Items</a><a th:href="@{/admin/claims}">✓ Pending Claims</a></aside><main class="dashboard-main"><div class="dash-top"><div><div class="eyebrow dark">ADMIN CONTROL CENTER</div><h1>Admin Dashboard</h1><p>Manage claims and system activity.</p></div></div><div class="stat-grid five"><div class="stat-card blue"><div><b th:text="${userCount}"></b><span>Total Users</span></div></div><div class="stat-card red"><div><b th:text="${lostCount}"></b><span>Lost Items</span></div></div><div class="stat-card green"><div><b th:text="${foundCount}"></b><span>Found Items</span></div></div><div class="stat-card purple"><div><b th:text="${pendingClaims}"></b><span>Pending Claims</span></div></div><div class="stat-card gold"><div><b th:text="${strongMatches}"></b><span>Strong Matches</span></div></div></div><div class="panel"><div class="section-head"><h2>Recent Activity</h2><a class="link-btn" th:href="@{/admin/claims}">Review Claims</a></div><div class="table-responsive"><table class="modern-table"><thead><tr><th>Reporter</th><th>Action</th><th>Item</th><th>Location</th><th>Date</th></tr></thead><tbody><tr th:each="item : ${activity}"><td th:text="${item.owner.name}"></td><td th:text="${item.itemType}"></td><td th:text="${item.itemName}"></td><td th:text="${item.location}"></td><td th:text="${#temporals.format(item.createdAt,'dd MMM yyyy')}"></td></tr></tbody></table></div></div></main></div><div th:replace="~{fragments :: footer}"></div></body></html>
